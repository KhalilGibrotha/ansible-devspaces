apiVersion: apps/v1
kind: Deployment
metadata:
  name: kroki
  labels:
    app.kubernetes.io/name: kroki
    app.kubernetes.io/part-of: ansible-devspaces
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kroki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kroki
    spec:
      containers:
        - name: kroki
          image: yuzutech/kroki:0.28.0
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kroki
  labels:
    app.kubernetes.io/name: kroki
    app.kubernetes.io/part-of: ansible-devspaces
spec:
  selector:
    app.kubernetes.io/name: kroki
  ports:
    - name: http
      port: 8000
      targetPort: http
