schemaVersion: 2.2.0
metadata:
  name: arc-ansible-devspace
  description: Development environment for Ansible playbooks and roles.
attributes:
  controller.devfile.io/storage-type: ephemeral
projects:
  - name: ansible-devspaces
    git:
      remotes:
        origin: "https://github.com/KhalilGibrotha/ansible-devspaces"
      checkoutFrom:
        revision: "codex/devspace-docx-next-iteration"
components:
  - name: ansible-tools
    container:
      image: ghcr.io/ansible/ansible-devspaces@sha256:d214eed0285eb589cb1dd2cf7fe5645d73bb9862bcf3b51c0c2101f9558b1de6
      memoryLimit: 2Gi
      cpuLimit: 1500m
      cpuRequest: 500m
      memoryRequest: 1Gi
      mountSources: true
      env:
        - name: ANSIBLE_CONFIG
          value: /projects/ansible-devspaces/ansible.cfg
        - name: PIP_CACHE_DIR
          value: /tmp/pip-cache
        - name: PYTHONUNBUFFERED
          value: "1"
      volumeMounts:
        - name: pip-cache
          path: /tmp/pip-cache
  - name: kroki-sidecar
    container:
      image: yuzutech/kroki:0.28.0
      memoryLimit: 1Gi
      memoryRequest: 256Mi
      cpuRequest: 100m
      cpuLimit: 500m
      env:
        - name: KROKI_LISTEN
          value: "0.0.0.0:8000"
        - name: KROKI_MERMAID_HOST
          value: "127.0.0.1"
        - name: KROKI_MERMAID_PORT
          value: "8002"
      endpoints:
        - name: kroki-http
          targetPort: 8000
          exposure: internal
  - name: kroki-mermaid-sidecar
    container:
      image: yuzutech/kroki-mermaid:0.28.0
      memoryLimit: 1Gi
      memoryRequest: 256Mi
      cpuRequest: 100m
      cpuLimit: 500m
      env:
        - name: KROKI_MERMAID_LISTEN
          value: "0.0.0.0:8002"
  - name: pip-cache
    volume:
      size: 1Gi
commands:
  - id: prepare-workspace-roots
    exec:
      label: Prepare workspace roots
      component: ansible-tools
      commandLine: bash ./scripts/devspace-prepare-workspace.sh
      workingDir: /projects/ansible-devspaces
      group:
        kind: build
  - id: install-galaxy-deps
    exec:
      label: Install Ansible Galaxy dependencies
      component: ansible-tools
      commandLine: ansible-galaxy install -r requirements.yml --force
      workingDir: /projects/ansible-devspaces
      group:
        kind: build
        isDefault: true
  - id: sync-upstream-repos
    exec:
      label: Synchronize upstream repositories
      component: ansible-tools
      commandLine: bash ./scripts/clone-repos.sh
      workingDir: /projects/ansible-devspaces
      group:
        kind: build
  - id: bootstrap-workspace
    exec:
      label: Bootstrap workspace dependencies
      component: ansible-tools
      commandLine: bash ./scripts/devspace-bootstrap.sh
      workingDir: /projects/ansible-devspaces
      group:
        kind: build
        isDefault: true
  - id: verify-kroki-sidecar
    exec:
      label: Verify Kroki sidecar
      component: ansible-tools
      commandLine: python3 ./scripts/verify-kroki.py
      workingDir: /projects/ansible-devspaces
      group:
        kind: test
  - id: validate-doc-diagrams
    exec:
      label: Validate Markdown diagrams
      component: ansible-tools
      commandLine: make diagram-lint
      workingDir: /projects/ansible-devspaces
      group:
        kind: test
  - id: validate-manifest-documents
    exec:
      label: Validate manifest-managed docs
      component: ansible-tools
      commandLine: make diagram-lint-all
      workingDir: /projects/ansible-devspaces
      group:
        kind: test
  - id: render-sample-docx-local
    exec:
      label: Render sample DOCX locally
      component: ansible-tools
      commandLine: bash ./scripts/docx-render-local.sh
      workingDir: /projects/ansible-devspaces
      group:
        kind: run
  - id: render-manifest-documents
    exec:
      label: Render manifest-managed DOCX docs
      component: ansible-tools
      commandLine: make docx-render-all
      workingDir: /projects/ansible-devspaces
      group:
        kind: run
  - id: run-sample-playbook
    exec:
      label: Run sample site playbook
      component: ansible-tools
      commandLine: ansible-playbook playbooks/site.yml
      workingDir: /projects/ansible-devspaces
      group:
        kind: run
        isDefault: true
  - id: run-ansible-lint
    exec:
      label: Run Ansible lint checks
      component: ansible-tools
      commandLine: make lint
      workingDir: /projects/ansible-devspaces
      group:
        kind: test
  - id: run-test-suite
    exec:
      label: Run test suite
      component: ansible-tools
      commandLine: make test
      workingDir: /projects/ansible-devspaces
      group:
        kind: test
  - id: open-shell
    exec:
      label: Open interactive shell
      component: ansible-tools
      commandLine: /bin/bash
      hotReloadCapable: true
